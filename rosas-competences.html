<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosas de Compétences Numériques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --olive:       #6b7c2d;
  --olive-dark:  #4f5e18;
  --olive-mid:   #8fa84e;
  --olive-light: #f4f6e8;
  --olive-border:#dde2b5;
}

body {
  background: #f7f8fc;
  color: #1e1e2e;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: #fff;
  border-bottom: 3px solid #e8eaf0;
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.header-icon {
  width: 48px; height: 48px;
  background: var(--olive);
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5em;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(107,124,45,0.35);
}
.header-text h1 {
  font-size: clamp(1em, 2.5vw, 1.35em);
  font-weight: 900;
  color: #1e1e2e;
  letter-spacing: -0.3px;
  line-height: 1.2;
}
.header-text p { font-size: 0.83em; color: #6b7280; margin-top: 3px; }
.back-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px;
  background: var(--olive-light); color: var(--olive-dark);
  border: 1.5px solid var(--olive-border);
  border-radius: 9px;
  font-size: 0.82em; font-weight: 800;
  text-decoration: none; white-space: nowrap;
  transition: background 0.15s, transform 0.15s;
  flex-shrink: 0;
}
.back-btn:hover { background: var(--olive-border); transform: translateY(-1px); }

/* ── LAYOUT ── */
.main {
  display: flex;
  flex-direction: row;
  gap: 24px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px;
  align-items: flex-start;
}

/* ── LEFT : QUESTIONS ── */
.questions-panel {
  flex: 1;
  min-width: 0;
  max-height: calc(100vh - 110px);
  overflow-y: auto;
  padding-right: 6px;
}
.questions-panel::-webkit-scrollbar { width: 5px; }
.questions-panel::-webkit-scrollbar-track { background: transparent; }
.questions-panel::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

/* ── RIGHT : CHART ── */
.chart-panel {
  width: 340px;
  flex-shrink: 0;
  position: sticky;
  top: 20px;
}

.chart-card {
  background: #fff;
  border-radius: 18px;
  padding: 20px 18px 18px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  border: 1.5px solid #e8eaf0;
}

.chart-card-title {
  font-size: 0.72em;
  font-weight: 800;
  color: #9ca3af;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 10px;
}

.radar-wrap {
  background: var(--olive-light);
  border-radius: 12px;
  padding: 6px;
  border: 1.5px solid var(--olive-border);
}
canvas#radar { width: 100%; aspect-ratio: 1 / 1; display: block; }

/* ── LEVEL BAR ── */
.level-section { margin-top: 14px; }
.level-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 7px;
}
.level-label { font-size: 0.8em; font-weight: 800; color: #374151; transition: color 0.4s; }
.score-display { font-size: 0.75em; font-weight: 700; color: #6b7280; }
.level-track { height: 10px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
.level-fill {
  height: 100%; width: 0%; border-radius: 99px;
  background: linear-gradient(90deg, var(--olive), var(--olive-mid));
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}

/* ── EXPORT SECTION ── */
.export-section {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1.5px solid #e8eaf0;
}
.export-label {
  font-size: 0.72em; font-weight: 800;
  color: #9ca3af; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 9px; display: block;
}
.name-input {
  width: 100%; padding: 9px 11px;
  border: 1.5px solid #e0e2f0; border-radius: 9px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.86em; font-weight: 600; color: #1e1e2e;
  background: #f7f8fc; outline: none;
  transition: border-color 0.2s, background 0.2s;
  margin-bottom: 9px;
}
.name-input:focus { border-color: var(--olive); background: #fff; }
.name-input::placeholder { color: #9ca3af; font-weight: 400; }

.export-btn {
  width: 100%; padding: 11px;
  background: linear-gradient(135deg, var(--olive), var(--olive-dark));
  color: #fff; border: none; border-radius: 11px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.9em; font-weight: 800;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 12px rgba(107,124,45,0.35);
}
.export-btn:hover  { opacity: 0.88; transform: translateY(-1px); }
.export-btn:active { transform: translateY(0); opacity: 1; }

/* ── CATEGORY CARDS ── */
.category {
  background: #fff; border-radius: 14px;
  margin-bottom: 12px; border: 1.5px solid #e8eaf0;
  overflow: hidden; transition: box-shadow 0.2s;
}
.category:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }

.category-header {
  padding: 12px 15px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1.5px solid transparent;
}
.cat-icon {
  font-size: 1.2em; width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.cat-name  { font-weight: 800; font-size: 0.9em; flex: 1; }
.cat-score {
  font-size: 0.76em; font-weight: 700;
  padding: 2px 8px; border-radius: 99px;
  background: #f3f4f6; color: #6b7280;
  white-space: nowrap;
  transition: background 0.3s, color 0.3s;
}

.mini-bar  { height: 4px; background: #f3f4f6; }
.mini-fill { height: 100%; width: 0%; transition: width 0.4s ease; border-radius: 0 2px 2px 0; }

.questions-list { padding: 5px 15px 10px; }

/* ── QUESTION ITEMS ── */
.question-item {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 9px 0;
  border-bottom: 1px solid #f3f4f6;
  cursor: pointer; user-select: none;
}
.question-item:last-child { border-bottom: none; }

.q-box {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid #d1d5db; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  color: transparent; background: #fff;
  transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.15s;
}
.question-item.checked .q-box { color: #fff; transform: scale(1.1); }

.question-text { font-size: 0.84em; line-height: 1.55; color: #6b7280; transition: color 0.2s; }
.question-item.checked .question-text { color: #1e1e2e; font-weight: 600; }

/* ── CATEGORY THEMES ── */
.cat-info     { --cc:#2563eb; --cl:#eff6ff; }
.cat-comm     { --cc:#e11d48; --cl:#fff1f3; }
.cat-creation { --cc:#16a34a; --cl:#f0fdf4; }
.cat-security { --cc:#d97706; --cl:#fffbeb; }
.cat-ai       { --cc:#6b7c2d; --cl:#f4f6e8; }

.cat-info     .category-header { border-bottom-color:#dbeafe; background:#eff6ff; }
.cat-comm     .category-header { border-bottom-color:#ffe4e6; background:#fff1f3; }
.cat-creation .category-header { border-bottom-color:#dcfce7; background:#f0fdf4; }
.cat-security .category-header { border-bottom-color:#fef3c7; background:#fffbeb; }
.cat-ai       .category-header { border-bottom-color:#dde2b5; background:#f4f6e8; }

.cat-info     .cat-icon { background:#dbeafe; }
.cat-comm     .cat-icon { background:#ffe4e6; }
.cat-creation .cat-icon { background:#dcfce7; }
.cat-security .cat-icon { background:#fef3c7; }
.cat-ai       .cat-icon { background:#dde2b5; }

.cat-info     .cat-name { color:#1d4ed8; }
.cat-comm     .cat-name { color:#be123c; }
.cat-creation .cat-name { color:#15803d; }
.cat-security .cat-name { color:#b45309; }
.cat-ai       .cat-name { color:#4f5e18; }

.cat-info     .mini-fill { background:#2563eb; }
.cat-comm     .mini-fill { background:#e11d48; }
.cat-creation .mini-fill { background:#16a34a; }
.cat-security .mini-fill { background:#d97706; }
.cat-ai       .mini-fill { background:#6b7c2d; }

.question-item.checked .q-box { background:var(--cc); border-color:var(--cc); }
.cat-score.done { background:var(--cl); color:var(--cc); }

/* ════════════════════════════
   RESPONSIVE
   ════════════════════════════ */

/* Desktop large : chart un peu plus étroit */
@media (max-width: 1100px) {
  .chart-panel { width: 300px; }
}

/* Tablette / grand téléphone (≤ 840px) : colonne, chart EN HAUT via order */
@media (max-width: 840px) {
  .main {
    flex-direction: column;
    padding: 14px 14px 24px;
    gap: 16px;
  }
  .chart-panel {
    width: 100%;
    position: static;
    order: -1; /* remonte le chart au-dessus des questions */
  }
  /* Sur tablette large : layout horizontal dans la carte */
  .chart-card {
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-areas:
      "title  title"
      "radar  level"
      "radar  export";
    column-gap: 18px;
    align-items: start;
  }
  .chart-card-title  { grid-area: title;  text-align: left; }
  .radar-wrap        { grid-area: radar;  align-self: start; }
  .level-section     { grid-area: level;  margin-top: 0; }
  .export-section    { grid-area: export; margin-top: 14px; }
  .questions-panel   { max-height: none; padding-right: 0; order: 1; }
}

/* Téléphone (≤ 600px) : tout empilé, carte radar en bloc simple */
@media (max-width: 600px) {
  .header       { padding: 12px 14px; gap: 10px; }
  .header-icon  { width: 40px; height: 40px; font-size: 1.25em; border-radius: 10px; }
  .header-text h1 { font-size: 0.97em; }
  .header-text p  { font-size: 0.76em; }
  .main         { padding: 10px 10px 20px; gap: 12px; }
  /* Carte radar redevient un bloc simple */
  .chart-card   { display: block; }
  .level-section  { margin-top: 12px; }
  .export-section { margin-top: 12px; padding-top: 12px; }
  .question-item  { gap: 9px; padding: 10px 0; }
  .q-box          { width: 24px; height: 24px; }
  .question-text  { font-size: 0.81em; }
  .cat-name       { font-size: 0.84em; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎯</div>
  <div class="header-text">
    <h1>Rosas de compétences numériques</h1>
    <p>Coche les compétences que tu maîtrises — ta rosas évolue en temps réel !</p>
  </div>
  <a href="index.html" class="back-btn" title="Retour au menu principal">
    <span>←</span> Accueil
  </a>
</div>

<div class="main">

  <!-- ── QUESTIONS (gauche / bas sur mobile) ── -->
  <div class="questions-panel" id="qPanel"></div>

  <!-- ── CHART (droite / haut sur mobile via order:-1) ── -->
  <div class="chart-panel">
    <div class="chart-card">
      <div class="chart-card-title">Mes compétences</div>
      <div class="radar-wrap">
        <canvas id="radar"></canvas>
      </div>
      <div class="level-section">
        <div class="level-row">
          <span class="level-label" id="levelLabel">Niveau 1 — Débutant</span>
          <span class="score-display" id="scoreDisplay">0 / 34</span>
        </div>
        <div class="level-track">
          <div class="level-fill" id="levelFill"></div>
        </div>
      </div>
      <div class="export-section">
        <span class="export-label">📄 Mon diplôme</span>
        <input type="text" id="studentName" class="name-input" placeholder="Ton prénom et nom…" maxlength="50">
        <button class="export-btn" onclick="generatePDF()">
          <span>Exporter mon diplôme</span><span>⬇</span>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════
const CATEGORIES = [
  {
    id:'info', icon:'💾',
    name:'Informations et données',
    cssClass:'cat-info', color:'#2563eb',
    pdfColor:[37,99,235],
    radarLabel:['Infos &','Données'],
    qs:[
      "Je sais distinguer un composant physique (hardware) d'un logiciel (software), et la mémoire vive de la mémoire morte.",
      "Je connais les unités Ko, Mo, Go, To : je sais les ordonner et expliquer le rapport ×1 000.",
      "Je sais identifier quel logiciel correspond à un type de fichier (ex : .pdf, .mp3, .docx…).",
      "Je sais utiliser correctement les termes : adresse IP, serveur, routeur, réseau, Internet.",
      "Je sais exporter un document dans le bon format selon le logiciel ou l'appareil de destination.",
      "Je sais organiser mes fichiers dans des dossiers logiques pour les retrouver facilement."
    ]
  },
  {
    id:'comm', icon:'💬',
    name:'Communication et collaboration',
    cssClass:'cat-comm', color:'#e11d48',
    pdfColor:[225,29,72],
    radarLabel:['Comm. &','Collab.'],
    qs:[
      "Je sais envoyer un email : objet, destinataire, Cc / Cci, pièce jointe, répondre et transférer.",
      "Je sais utiliser une application de messagerie instantanée, y compris dans un groupe.",
      "Je sais choisir le bon outil de communication selon la situation et mon interlocuteur.",
      "Je respecte la nétiquette (politesse et ton adapté) dans mes communications en ligne.",
      "Je respecte les droits d'auteur, la vie privée et le droit à l'image dans mes échanges.",
      "Je sais créer un sondage ou un quiz en ligne et analyser simplement les résultats.",
      "Je connais les notions de droit à la vie privée, droit à l'oubli et licence open source."
    ]
  },
  {
    id:'creation', icon:'✏️',
    name:'Création de contenus',
    cssClass:'cat-creation', color:'#16a34a',
    pdfColor:[22,163,74],
    radarLabel:['Création de','Contenus'],
    qs:[
      "Je sais mettre en forme un texte : puces, numéros, alignements, marges, entête et pied de page.",
      "Je sais insérer des éléments dans un document : tableau, image, lien, note de bas de page.",
      "Je sais choisir le bon logiciel ou application selon ce que je veux créer.",
      "Je sais expliquer ce qu'est une variable en programmation.",
      "Je sais lire et créer un logigramme avec une condition, une boucle et une variable.",
      "Je sais écrire un programme simple à partir d'un logigramme, le tester et corriger les erreurs.",
      "Je sais expliquer ce que sont les Fake News et comment les repérer.",
      "Je peux évaluer l'impact environnemental de différents usages numériques."
    ]
  },
  {
    id:'security', icon:'🔒',
    name:'Sécurité',
    cssClass:'cat-security', color:'#d97706',
    pdfColor:[217,119,6],
    radarLabel:['Sécurité'],
    qs:[
      "Je sais distinguer HTTP et HTTPS et expliquer pourquoi HTTPS est plus sécurisé.",
      "Je sais paramétrer les options de confidentialité d'un compte en ligne.",
      "Je sais effacer toutes mes traces de connexion sur un ordinateur partagé.",
      "Je sais reconnaître et réagir face au cyberharcèlement, aux cyberattaques et à la cybermanipulation.",
      "Je comprends la différence entre collecte active (formulaires) et passive (cookies, géolocalisation).",
      "Je gère mon identité numérique de manière responsable pour protéger ma vie privée.",
      "Je connais les techniques des plateformes pour capter l'attention et je gère mon temps d'écran."
    ]
  },
  {
    id:'ai', icon:'🤖',
    name:'Intelligence artificielle',
    cssClass:'cat-ai', color:'#6b7c2d',
    pdfColor:[107,124,45],
    radarLabel:['Intelligence','Artificielle'],
    qs:[
      "Je sais distinguer l'IA classique de l'IA générative.",
      "Je sais expliquer simplement comment fonctionne l'IA et le Machine Learning.",
      "Je connais les limites de l'IA : hallucinations, biais et stéréotypes.",
      "Je comprends ce qu'est un usage transparent et éthique de l'IA.",
      "Je sais formuler et améliorer un prompt pour obtenir de bons résultats avec une IA.",
      "Je sais choisir le bon outil d'IA pour une tâche donnée et justifier mon choix."
    ]
  }
];

const TOTAL_Q = CATEGORIES.reduce((s,c) => s + c.qs.length, 0);
const checked = {};
CATEGORIES.forEach(c => { checked[c.id] = new Array(c.qs.length).fill(false); });

// ════════════════════════════════════════════
//  BUILD UI
// ════════════════════════════════════════════
const panel = document.getElementById('qPanel');
CATEGORIES.forEach(cat => {
  const sec = document.createElement('div');
  sec.className = `category ${cat.cssClass}`;
  sec.innerHTML = `
    <div class="category-header">
      <div class="cat-icon">${cat.icon}</div>
      <span class="cat-name">${cat.name}</span>
      <span class="cat-score" id="sc-${cat.id}">0 / ${cat.qs.length}</span>
    </div>
    <div class="mini-bar"><div class="mini-fill" id="mb-${cat.id}"></div></div>
    <div class="questions-list" id="ql-${cat.id}"></div>`;
  panel.appendChild(sec);

  const qList = sec.querySelector(`#ql-${cat.id}`);
  cat.qs.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'question-item';
    item.style.setProperty('--cc', cat.color);
    item.innerHTML = `<div class="q-box">✓</div><span class="question-text">${q}</span>`;
    item.addEventListener('click', () => {
      checked[cat.id][i] = !checked[cat.id][i];
      item.classList.toggle('checked', checked[cat.id][i]);
      updateAll();
    });
    qList.appendChild(item);
  });
});

// ════════════════════════════════════════════
//  CANVAS — résolution fixe haute, CSS gère l'affichage
// ════════════════════════════════════════════
const canvas  = document.getElementById('radar');
const DPR     = window.devicePixelRatio || 1;
const N       = CATEGORIES.length;
const VISUAL  = 700;   // résolution interne élevée, CSS scale via aspect-ratio:1

canvas.width  = VISUAL * DPR;
canvas.height = VISUAL * DPR;
// PAS de canvas.style.width/height → CSS width:100% + aspect-ratio:1 remplit le conteneur

const ctx = canvas.getContext('2d');
ctx.scale(DPR, DPR);

/* Reusable radar renderer — works on any canvas context at any size */
function renderRadar(rCtx, size, scores) {
  const cx = size / 2, cy = size / 2;
  const maxR  = size / 2 - size * 0.12;   // marge calculée pour labels + bulles
  const scale = size / 320;
  const angles = CATEGORIES.map((_, i) => (2 * Math.PI * i) / N - Math.PI / 2);
  function pt(a, r) { return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }

  // Grid rings
  for (let lv = 4; lv >= 1; lv--) {
    const r = (maxR * lv) / 4;
    rCtx.beginPath();
    angles.forEach((a, i) => { const p = pt(a,r); i===0 ? rCtx.moveTo(p.x,p.y) : rCtx.lineTo(p.x,p.y); });
    rCtx.closePath();
    rCtx.fillStyle   = lv===4 ? 'rgba(255,255,255,0.8)' : 'transparent';
    rCtx.fill();
    rCtx.strokeStyle = lv===4 ? 'rgba(107,124,45,0.35)' : 'rgba(150,165,100,0.2)';
    rCtx.lineWidth   = lv===4 ? 1.5 : 1;
    rCtx.stroke();
  }
  // Axis lines
  angles.forEach(a => {
    const p = pt(a, maxR);
    rCtx.beginPath(); rCtx.moveTo(cx,cy); rCtx.lineTo(p.x,p.y);
    rCtx.strokeStyle = 'rgba(107,124,45,0.22)'; rCtx.lineWidth = 1; rCtx.stroke();
  });
  // Filled polygon
  if (scores.some(s => s > 0.005)) {
    rCtx.beginPath();
    scores.forEach((s,i) => { const p = pt(angles[i],s*maxR); i===0 ? rCtx.moveTo(p.x,p.y) : rCtx.lineTo(p.x,p.y); });
    rCtx.closePath();
    rCtx.fillStyle = 'rgba(107,124,45,0.20)'; rCtx.fill();
    rCtx.strokeStyle = '#6b7c2d';
    rCtx.lineWidth = Math.max(1.5, size*0.007);
    rCtx.lineJoin = 'round'; rCtx.stroke();
    scores.forEach((s,i) => {
      if (s < 0.01) return;
      const p = pt(angles[i], s*maxR);
      const dr = Math.max(3.5, size*0.013);
      rCtx.beginPath(); rCtx.arc(p.x,p.y,dr,0,Math.PI*2);
      rCtx.fillStyle = CATEGORIES[i].color; rCtx.fill();
      rCtx.strokeStyle = '#fff'; rCtx.lineWidth = Math.max(1.5, size*0.005); rCtx.stroke();
    });
  }
  // Labels
  const labelR = maxR + 12*scale;
  CATEGORIES.forEach((cat, i) => {
    const p = pt(angles[i], labelR);
    const bR = 9*scale;
    rCtx.beginPath(); rCtx.arc(p.x, p.y-10*scale, bR, 0, Math.PI*2);
    rCtx.fillStyle = '#fff'; rCtx.fill();
    rCtx.strokeStyle = cat.color+'66'; rCtx.lineWidth = 1.5; rCtx.stroke();
    rCtx.font = `${Math.round(12*scale)}px serif`;
    rCtx.textAlign = 'center'; rCtx.textBaseline = 'middle';
    rCtx.fillText(cat.icon, p.x, p.y-10*scale);
    rCtx.font = `800 ${Math.round(8.5*scale)}px 'Nunito',sans-serif`;
    rCtx.fillStyle = cat.color;
    cat.radarLabel.forEach((line, li) => rCtx.fillText(line, p.x, p.y+(6+li*10)*scale));
  });
}

// Animation
let current = new Array(N).fill(0);
let target  = new Array(N).fill(0);
let rafId   = null;
function tick() {
  let moving = false;
  current = current.map((c,i) => {
    const d = target[i]-c;
    if (Math.abs(d)<0.004) return target[i];
    moving = true; return c+d*0.11;
  });
  ctx.clearRect(0,0,VISUAL,VISUAL);
  renderRadar(ctx, VISUAL, current);
  rafId = moving ? requestAnimationFrame(tick) : null;
}
function animateTo(t) { target=t; if(!rafId) rafId=requestAnimationFrame(tick); }

// ════════════════════════════════════════════
//  LEVELS
// ════════════════════════════════════════════
const LEVELS = [
  { min:0,    label:'Niveau 1 — Débutant',   color:'#9ca3af', grad:'linear-gradient(90deg,#9ca3af,#d1d5db)' },
  { min:0.12, label:'Niveau 2 — Apprenti',   color:'#16a34a', grad:'linear-gradient(90deg,#16a34a,#4ade80)' },
  { min:0.30, label:'Niveau 3 — Initié',     color:'#2563eb', grad:'linear-gradient(90deg,#2563eb,#60a5fa)' },
  { min:0.50, label:'Niveau 4 — Confirmé',   color:'#d97706', grad:'linear-gradient(90deg,#d97706,#fbbf24)' },
  { min:0.70, label:'Niveau 5 — Expert',     color:'#e11d48', grad:'linear-gradient(90deg,#e11d48,#fb7185)' },
  { min:0.90, label:'Niveau MAX — Maître ✨', color:'#6b7c2d', grad:'linear-gradient(90deg,#6b7c2d,#8fa84e)' },
];

// ════════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════════
function updateAll() {
  const scores = CATEGORIES.map(cat => checked[cat.id].filter(Boolean).length / cat.qs.length);
  const total  = CATEGORIES.reduce((s,cat) => s + checked[cat.id].filter(Boolean).length, 0);
  const pct    = total / TOTAL_Q;
  animateTo(scores);
  CATEGORIES.forEach((cat,i) => {
    const n   = checked[cat.id].filter(Boolean).length;
    const scEl = document.getElementById(`sc-${cat.id}`);
    scEl.textContent = `${n} / ${cat.qs.length}`;
    scEl.className   = 'cat-score'+(n===cat.qs.length?' done':'');
    document.getElementById(`mb-${cat.id}`).style.width = `${scores[i]*100}%`;
  });
  let lv = LEVELS[0];
  LEVELS.forEach(l => { if(pct>=l.min) lv=l; });
  document.getElementById('levelLabel').textContent = lv.label;
  document.getElementById('levelLabel').style.color = lv.color;
  document.getElementById('levelFill').style.background = lv.grad;
  document.getElementById('levelFill').style.width = `${pct*100}%`;
  document.getElementById('scoreDisplay').textContent = `${total} / ${TOTAL_Q}`;
}

// ════════════════════════════════════════════
//  PDF EXPORT
// ════════════════════════════════════════════

/* Strip diacritics — jsPDF Helvetica ne supporte pas les accents */
function ascii(str) {
  return str.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[×]/g,'x').replace(/[–—]/g,'-');
}

function generatePDF() {
  if (!window.jspdf) { alert('La librairie PDF se charge encore, réessaie dans un instant.'); return; }
  const studentName = document.getElementById('studentName').value.trim() || 'Eleve';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'p', unit:'mm', format:'a4' });
  const PW=210, PH=297;

  // ── Palette ──
  const OLIVE   = [107,124,45];
  const OLIVEDARK=[79,94,24];
  const DARK    = [30,30,46];
  const GRAY    = [107,114,128];
  const LGRAY   = [229,231,235];
  const OLIVEBG = [244,246,232];
  const WHITE   = [255,255,255];

  // ── Double border ──
  doc.setDrawColor(...OLIVE); doc.setLineWidth(0.8);
  doc.rect(7,7,PW-14,PH-14);
  doc.setLineWidth(0.25);
  doc.rect(9.5,9.5,PW-19,PH-19);

  // Corner dots
  [[7,7],[PW-7,7],[7,PH-7],[PW-7,PH-7]].forEach(([x,y]) => {
    doc.setFillColor(...OLIVE); doc.circle(x,y,2.2,'F');
  });

  // ── Header band ──
  doc.setFillColor(...OLIVE);
  doc.rect(7,7,PW-14,30,'F');
  doc.setFillColor(...OLIVEDARK);
  doc.rect(7,7,PW-14,4,'F');

  doc.setTextColor(...WHITE);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('COURS DE NUMÉRIQUE', PW/2, 21, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Formation FMTTN  |  1re Secondaire  |  2026-2027', PW/2, 29, {align:'center'});

  // ── Titre principal ──
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  doc.setTextColor(...GRAY);
  doc.text('ATTESTATION DE', PW/2, 46, {align:'center'});
  doc.setFontSize(20); doc.setTextColor(...OLIVE);
  doc.text('COMPÉTENCES NUMÉRIQUES', PW/2, 57, {align:'center'});

  // Double divider
  doc.setDrawColor(...OLIVE); doc.setLineWidth(0.6);
  doc.line(25,61,PW-25,61);
  doc.setLineWidth(0.2); doc.line(32,63,PW-32,63);

  // ── Nom étudiant ──
  doc.setFont('helvetica','italic'); doc.setFontSize(9);
  doc.setTextColor(...GRAY);
  doc.text('décernée à', PW/2, 71, {align:'center'});

  doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.setTextColor(...DARK);
  doc.text(ascii(studentName), PW/2, 82, {align:'center'});

  const nw = doc.getTextWidth(ascii(studentName));
  doc.setDrawColor(...OLIVE); doc.setLineWidth(0.7);
  doc.line(PW/2-nw/2, 84.5, PW/2+nw/2, 84.5);

  doc.setFont('helvetica','italic'); doc.setFontSize(8.5);
  doc.setTextColor(...GRAY);
  doc.text('pour avoir maîtrisé les compétences numériques du cours de 1re secondaire', PW/2, 92, {align:'center'});

  // ── Badge niveau ──
  const total = CATEGORIES.reduce((s,cat) => s+checked[cat.id].filter(Boolean).length, 0);
  const pct   = total/TOTAL_Q;
  let lv = LEVELS[0];
  LEVELS.forEach(l => { if(pct>=l.min) lv=l; });
  const lvLabel = ascii(lv.label.replace(/✨/g,'').trim());

  doc.setFillColor(...OLIVEBG); doc.setDrawColor(...OLIVE); doc.setLineWidth(0.5);
  doc.roundedRect(PW/2-40,96,80,11,3,3,'FD');
  doc.setTextColor(...OLIVE); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(lvLabel, PW/2, 103.5, {align:'center'});

  // ── Radar (offscreen canvas 480px) ──
  const OFF=900;
  const offC=document.createElement('canvas');
  offC.width=OFF; offC.height=OFF;
  const offCtx=offC.getContext('2d');
  offCtx.fillStyle='#f4f6e8'; offCtx.fillRect(0,0,OFF,OFF);
  renderRadar(offCtx,OFF,current);
  const radarImg = offC.toDataURL('image/png');

  // Chart card: centré, 84×84mm
  const cX=PW/2-42, cY=110, cW=84, cH=84;
  doc.setFillColor(...OLIVEBG); doc.setDrawColor(200,210,160); doc.setLineWidth(0.5);
  doc.roundedRect(cX-2,cY-2,cW+4,cH+4,5,5,'FD');
  doc.addImage(radarImg,'PNG',cX,cY,cW,cH);

  // Chip score global
  const chipY = cY+cH+4;
  doc.setFillColor(...OLIVEBG); doc.setDrawColor(...OLIVE); doc.setLineWidth(0.4);
  doc.roundedRect(PW/2-26,chipY,52,9,2,2,'FD');
  doc.setTextColor(...OLIVE); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  doc.text(`${total} / ${TOTAL_Q} compétences`, PW/2, chipY+6.2, {align:'center'});

  // ── Section scores ──
  // cY+cH = 194 + chip(13) = 207 → sY=207
  const sY = chipY+13; // ~207

  doc.setDrawColor(...OLIVE); doc.setLineWidth(0.3);
  doc.line(25,sY,PW-25,sY);
  doc.setTextColor(...GRAY); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  doc.text('DÉTAIL PAR DOMAINE', PW/2, sY+6, {align:'center'});

  // 5 lignes × 11mm : sY+10 → sY+10+4*11 = sY+54 ≈ 261mm
  const ROW=11, barX=35, barW=148;
  CATEGORIES.forEach((cat,i) => {
    const ry = sY+10+i*ROW;

    // Puce colorée
    doc.setFillColor(...cat.pdfColor);
    doc.circle(28.5, ry+2, 2.2, 'F');

    // Nom de la catégorie
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor(...DARK);
    doc.text(ascii(cat.name), 33, ry+3.5);

    // Score X/Y aligné à droite
    const n=checked[cat.id].filter(Boolean).length;
    const tot=cat.qs.length;
    doc.setFont('helvetica','bold'); doc.setTextColor(...cat.pdfColor);
    doc.text(`${n}/${tot}`, PW-25, ry+3.5, {align:'right'});

    // Barre sous le nom
    doc.setFillColor(...LGRAY);
    doc.roundedRect(barX, ry+5.5, barW, 3, 1,1, 'F');
    if (n>0) {
      doc.setFillColor(...cat.pdfColor);
      doc.roundedRect(barX, ry+5.5, barW*(n/tot), 3, 1,1, 'F');
    }
  });

  // ── Footer ──
  // Scores terminent à sY+10+4*11 = sY+54 ≈ 261 → footer à 271
  const fY = sY+10+4*ROW+ROW-2; // footer calé pour rester dans la bordure
  doc.setDrawColor(...OLIVE); doc.setLineWidth(0.3);
  doc.line(25,fY,PW-25,fY);

  const dateStr = new Date().toLocaleDateString('fr-BE',{day:'2-digit',month:'long',year:'numeric'});
  doc.setTextColor(...GRAY); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.text(`Fait le ${dateStr}`, PW/2, fY+6, {align:'center'});

  doc.save(`diplome-numerique-${ascii(studentName).replace(/\s+/g,'-')}.pdf`);
}

// ── Init ──
renderRadar(ctx, VISUAL, current);
updateAll();
</script>

</html>
